name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Safe placeholders only. The build/type-check does not require real
  # Supabase credentials; never put production secrets in this workflow.
  PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  PUBLIC_SUPABASE_ANON_KEY: "your-anon-key"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build
